[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "data", "experiments"]

[tool.ruff.lint.per-file-ignores]
# Verbatim Razorpay doc strings — reflowing them would violate "verbatim
# means verbatim" (see the module docstring in scripts/harvest_errors.py).
"scripts/harvest_errors.py" = ["E501"]
# typer.Option(...) as a parameter default is the library's own required
# API surface, not a mutable-default bug — ruff's B008 only special-cases
# the `X | None = typer.Option(None, ...)` shape, not typer's `list[...]`
# or `Path`-typed options, both used by --source and --customers below.
"src/runner.py" = ["B008"]
"scripts/demo.py" = ["B008"]
"src/ui/approve.py" = ["B008"]

# pytest config lives in pytest.ini, not here — pytest.ini takes precedence
# over [tool.pytest.ini_options] whenever both exist, so a section here
# would silently stop being read rather than merge with it.
