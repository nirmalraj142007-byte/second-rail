# Second Rail — guardrail thresholds. Every money-adjacent number the
# system enforces lives here, not in src/. See CLAUDE.md non-negotiables.
max_actions_per_payment: 1          # one recovery attempt per payment_id, ever — no repeat nudges on the same episode
max_contacts_per_customer_7d: 2     # cross-episode cap so one customer isn't nudged repeatedly in a week
quiet_hours: {start: "21:00", end: "09:00", tz: "Asia/Kolkata"}   # hard block — no customer contact overnight
max_episode_age_hours: 72           # matches outcome_model.md's rationale for the attribution window staying shorter than this
auto_approve_ceiling_paise: 500000  # TODO justify — Phase 14 experiment; currently set to match policy_table.yaml band A2's max
batch_contact_ceiling: 50           # max customers contacted in one run, caps blast radius of a bad config
per_run_exposure_ceiling_paise: 20000000    # notional total link value a single run may create, not real money moved
outage_cluster_threshold: 15        # TODO justify — Phase 14 experiment; feeds policy_table.yaml hard_refuse_conditions.issuer_outage_cluster
executor_retry_cap: 3               # TODO justify — Phase 14 experiment
executor_backoff_seconds: [1, 2, 4]  # seconds between retries, matches executor_retry_cap in length
consecutive_executor_errors_stop: 3  # 3 back-to-back executor failures halts the run rather than burning through episodes blind
kill_switch_path: "KILL"            # presence of this file on disk halts the run before the next episode starts
default_mode: dry_run               # execution requires --execute
attribution_window_hours: 48        # must match outcome_model.md §3 — config_check asserts this
