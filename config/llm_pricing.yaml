# Second Rail — LLM per-token pricing, in paise per 1,000 tokens.
#
# Fetched: 2026-08-30. Sources are each vendor's own pricing page, not an
# aggregator, read directly on the fetch date above:
#   gemini-3.6-flash — https://ai.google.dev/gemini-api/docs/pricing
#     standard tier: $0.75 / 1M input tokens, $3.75 / 1M output tokens
#     (through 2026-12-31; $1.50 / $7.50 from 2027-01-01 — irrelevant to
#     this project's window, so the pre-2027 rate is what's used here).
#   gemini-2.5-flash — same page, kept for reference / a key on an older
#     project that still has access: $0.30 / 1M input, $2.50 / 1M output.
#     A live call against this project's own key returned HTTP 404 "no
#     longer available to new users" on gemini-2.5-flash on 2026-08-30 —
#     see BUILD_LOG.md. Kept working end to end (verified with its own live
#     call), but its free tier couldn't sustain this phase's evidence pass
#     at any RPM pacing that actually held, which is why LLM_MODEL now
#     defaults to openai/gpt-oss-20b via Groq in .env.example instead.
#   gpt-4o-mini      — https://developers.openai.com/api/docs/pricing
#     standard tier: $0.15 / 1M input tokens, $0.60 / 1M output tokens.
#   openai/gpt-oss-20b (via Groq) — https://console.groq.com/docs/model/openai/gpt-oss-20b
#     $0.075 / 1M input tokens, $0.30 / 1M output tokens. Added when the
#     Gemini free tier's real, live-tested throughput (see BUILD_LOG.md)
#     turned out too slow to run this phase's full evidence pass in one
#     sitting — Groq's request/response shape is OpenAI-compatible.
#
# usd_to_inr is the one genuinely illustrative number in this file — a
# rounded conversion constant, not a live rate. Sourced from the 7-day
# average quoted by https://www.x-rates.com/average/?from=USD&to=INR on
# 2026-08-26 (95.2), rounded to 95 for a stable constant that doesn't need
# updating every time INR moves half a rupee. The USD figures above are
# copied verbatim off each vendor's page, not estimated — prices change, so
# re-fetch and update the fetch date rather than editing paise values by hand.
#
# cost_paise = (input_tokens/1000)*input_paise_per_1k
#            + (output_tokens/1000)*output_paise_per_1k
# input_paise_per_1k  = usd_per_1M_input  * usd_to_inr / 10
# output_paise_per_1k = usd_per_1M_output * usd_to_inr / 10
usd_to_inr: 95.0

models:
  gemini-3.6-flash:
    input_paise_per_1k: 7.125    # $0.75/1M * 95 / 10
    output_paise_per_1k: 35.625  # $3.75/1M * 95 / 10
  gemini-2.5-flash:
    input_paise_per_1k: 2.85     # $0.30/1M * 95 / 10
    output_paise_per_1k: 23.75   # $2.50/1M * 95 / 10
  gpt-4o-mini:
    input_paise_per_1k: 1.425    # $0.15/1M * 95 / 10
    output_paise_per_1k: 5.7     # $0.60/1M * 95 / 10
  openai/gpt-oss-20b:
    input_paise_per_1k: 0.7125   # $0.075/1M * 95 / 10
    output_paise_per_1k: 2.85    # $0.30/1M * 95 / 10
